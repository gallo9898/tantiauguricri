<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>✨ Tanti Auguri Cri🦄 ✨</title>
  <style>
    :root{
      --pink:#ff4fd8;
      --hot:#ff00b8;
      --aqua:#00f2ff;
      --lime:#b8ff00;
      --bg1:#12001a;
      --bg2:#24002e;
    }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:#fff;
      overflow-x:hidden;
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(255,79,216,.25), transparent 60%),
        radial-gradient(1000px 700px at 80% 20%, rgba(0,242,255,.18), transparent 55%),
        radial-gradient(900px 600px at 50% 90%, rgba(184,255,0,.12), transparent 60%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
    }

    .glitter{
      position:fixed; inset:-40px;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 1px, transparent 2px),
        radial-gradient(circle, rgba(255,255,255,.65) 1px, transparent 2px),
        radial-gradient(circle, rgba(255,255,255,.45) 1px, transparent 2px);
      background-size: 40px 40px, 55px 55px, 70px 70px;
      background-position: 0 0, 10px 20px, 25px 10px;
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 6px rgba(255,79,216,.55));
      animation: drift 8s linear infinite;
      pointer-events:none;
      opacity:.55;
    }
    @keyframes drift{
      from{ transform: translate3d(0,0,0) rotate(0deg); }
      to{ transform: translate3d(40px,30px,0) rotate(2deg); }
    }

    header{
      padding: 42px 16px 16px;
      text-align:center;
      position:relative;
      z-index:2;
    }

    .title{
      font-size: clamp(34px, 6vw, 72px);
      font-weight: 900;
      letter-spacing: .02em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--pink), var(--aqua), var(--lime), var(--hot));
      -webkit-background-clip:text;
      background-clip:text;
      color: transparent;
      text-shadow:
        0 0 12px rgba(255,79,216,.5),
        0 0 24px rgba(0,242,255,.25);
      filter: saturate(1.4);
      margin: 0 0 6px;
    }

    .subtitle{
      margin:0 auto;
      max-width: 980px;
      font-size: clamp(16px, 2.3vw, 22px);
      opacity:.92;
      line-height:1.35;
    }

    .stage{
      display:grid;
      grid-template-columns: 1fr;
      gap: 16px;
      place-items:center;
      padding: 18px 16px 54px;
      position:relative;
      z-index:2;
    }

    .card{
      width:min(980px, 94vw);
      background: rgba(255,255,255,.08);
      border: 2px solid rgba(255,255,255,.18);
      border-radius: 22px;
      box-shadow:
        0 18px 60px rgba(0,0,0,.35),
        0 0 28px rgba(255,79,216,.22);
      backdrop-filter: blur(10px);
      overflow:hidden;
      position:relative;
    }

    .card-inner{
      display:grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 0;
    }
    @media (max-width: 820px){
      .card-inner{ grid-template-columns: 1fr; }
    }

    .toon-wrap{
      position:relative;
      padding: 18px;
      display:grid;
      place-items:center;
      min-height: 420px;
      overflow:hidden;
    }
    .toon-wrap::before{
      content:"";
      position:absolute; inset:-50px;
      background:
        conic-gradient(from 180deg, rgba(255,79,216,.0), rgba(255,79,216,.25), rgba(0,242,255,.18), rgba(184,255,0,.12), rgba(255,0,184,.18), rgba(255,79,216,.0));
      animation: spin 9s linear infinite;
      filter: blur(16px);
    }
    @keyframes spin{ to{ transform: rotate(360deg);} }

    /* GIF al posto dell’SVG */
    .gif-toon{
      width: min(380px, 80vw);
      aspect-ratio: 1 / 1;
      object-fit: contain;
      position:relative;
      z-index:1;
      filter: drop-shadow(0 18px 26px rgba(0,0,0,.35));
      animation: bop 1.1s ease-in-out infinite;
      border-radius: 18px;
    }
    @keyframes bop{
      0%,100%{ transform: translateY(0) rotate(-1deg); }
      50%{ transform: translateY(-10px) rotate(1deg); }
    }

    .panel{
      padding: 22px 22px 18px;
      position:relative;
      background:
        linear-gradient(180deg, rgba(0,0,0,.10), rgba(0,0,0,.18)),
        radial-gradient(900px 500px at 30% 30%, rgba(255,79,216,.20), transparent 55%);
      border-left: 2px dashed rgba(255,255,255,.22);
    }
    @media (max-width: 820px){
      .panel{ border-left:none; border-top: 2px dashed rgba(255,255,255,.22); }
    }

    .badge{
      display:inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 800;
      letter-spacing:.04em;
      background: rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.25);
      box-shadow: 0 0 18px rgba(255,0,184,.2);
      text-transform: uppercase;
      font-size: 12px;
    }

    .lyrics{
      margin: 14px 0 6px;
      font-size: clamp(18px, 2.4vw, 26px);
      line-height:1.35;
      font-weight: 800;
      text-shadow: 0 0 12px rgba(255,79,216,.35);
    }
    .lyrics span{
      display:inline-block;
      animation: sparkle 1.8s ease-in-out infinite;
      background: linear-gradient(90deg, #fff, #ffe1ff, #d7ffff, #f7ffcf, #fff);
      -webkit-background-clip:text;
      background-clip:text;
      color: transparent;
    }
    .lyrics span:nth-child(2){ animation-delay:.15s; }
    .lyrics span:nth-child(3){ animation-delay:.30s; }
    .lyrics span:nth-child(4){ animation-delay:.45s; }
    .lyrics span:nth-child(5){ animation-delay:.60s; }
    @keyframes sparkle{
      0%,100%{ transform: translateY(0) rotate(-1deg); filter: drop-shadow(0 0 0 rgba(255,255,255,0)); }
      50%{ transform: translateY(-6px) rotate(1deg); filter: drop-shadow(0 0 10px rgba(255,255,255,.6)); }
    }

   .controls{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:14px;

  justify-content: center; /* centra orizzontalmente */
  align-items: center;     /* allinea bene in altezza */
}

@media (max-width: 520px){
  .controls{
    flex-direction: column;
    align-items: stretch;  
  }
}
    button{
      appearance:none;
      border:none;
      cursor:pointer;
      padding: 12px 14px;
      border-radius: 14px;
      font-weight: 800;
      letter-spacing:.02em;
      color:#140014;
      background: linear-gradient(90deg, var(--pink), var(--aqua), var(--lime));
      box-shadow: 0 12px 26px rgba(0,0,0,.25);
      transform: translateZ(0);
    }
    button:hover{ filter: brightness(1.05) saturate(1.25); }
    button:active{ transform: scale(.98); }

    .tiny{
      opacity:.85;
      font-size: 13px;
      margin-top: 10px;
      line-height:1.35;
    }

    .floaty{
      position:fixed;
      left: var(--x);
      bottom: -40px;
      font-size: var(--s);
      opacity:.9;
      filter: drop-shadow(0 0 10px rgba(255,79,216,.35));
      animation: rise var(--t) linear infinite;
      pointer-events:none;
      z-index:1;
    }
    @keyframes rise{
      to{
        transform: translateY(-115vh) rotate(360deg);
        opacity:0;
      }
    }

    canvas#confetti{
      position:fixed; inset:0;
      pointer-events:none;
      z-index:3;
    }

    footer{
      text-align:center;
      padding: 10px 16px 40px;
      opacity:.8;
      z-index:2;
      position:relative;
      font-size: 13px;
    }
    .wink{ filter: drop-shadow(0 0 10px rgba(0,242,255,.28)); }
    /* ---- Mobile-first tweaks per QR/telefono ---- */

/* migliora viewport su iPhone (notch, ecc.) */
body{
  padding-bottom: env(safe-area-inset-bottom);
}

/* card: più stretta e più “touch” */
.card{
  width: min(980px, 92vw);
  border-radius: 20px;
}

/* su mobile: sempre colonna singola e padding più comodo */
@media (max-width: 900px){
  .card-inner{
    grid-template-columns: 1fr;
  }
  header{
    padding: 28px 14px 10px;
  }
  .stage{
    padding: 10px 12px 38px;
  }
  .panel{
    border-left: none;
    border-top: 2px dashed rgba(255,255,255,.22);
    padding: 18px 16px 16px;
  }
  .toon-wrap{
    min-height: unset;
    padding: 14px 12px 8px;
  }
}

/* GIF: adattabile (non taglia), limita altezza a schermo */
.gif-toon{
  width: min(420px, 88vw);
  height: min(46vh, 420px);
  aspect-ratio: auto;      /* evita crop/forzature */
  object-fit: contain;
  border-radius: 18px;
}

/* titolo e testo più “mobile friendly” */
.subtitle{
  padding: 0 6px;
}

/* controlli: su telefono bottoni larghi e comodi */
@media (max-width: 520px){
  .controls{
    flex-direction: column;
    gap: 10px;
  }
  button{
    width: 100%;
    padding: 14px 14px;
    border-radius: 16px;
    font-size: 15px;
  }
  .tiny{
    font-size: 12.5px;
  }
}

/* Centra tutto il contenuto della sezione destra */
.panel{
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Mantiene i testi centrati */
.lyrics,
.tiny,
.badge{
  text-align: center;
}

/* Pulsanti centrati */
.controls{
  justify-content: center;
  align-items: center;
}
  </style>
</head>
<body>
  <div class="glitter"></div>
  <canvas id="confetti"></canvas>

  <header>
    <h1 class="title">Tanti Auguri Cri🦄💖</h1>
    <p class="subtitle">
      Benvenuta nel regno dei <b>quasi trenta</b>
    </p>
  </header>

  <main class="stage">
    <section class="card">
      <div class="card-inner">
        <div class="toon-wrap">
          <!-- ✅ METTI QUI LA TUA GIF -->
          <img
            class="gif-toon"
            id="gifToon"
            src="./tenor.gif"
            alt="GIF di Cristina"
            loading="eager"
            decoding="async"
          />
        </div>

        <div class="panel">
          

          <div class="lyrics" id="lyrics">
            
          </div>

          <div class="controls">
            <button id="singBtn">▶️ CANTA “TANTI AUGURI”</button>
            <button id="moreBtn">✨ PIÙ CRINGE</button>
            <!-- ❌ rimosso bottone "Cambia nome" -->
          </div>

          <p class="tiny">
            Clicca <b>“Più cringe”</b> finché il browser non ti giudica.
          </p>
          <p class="tiny wink">P.S. Da oggi seipiu che maggiorenne, tvb 👑✨</p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    Non saremo mai d'accordo ma il mondo è bello perche si possono avere più punti di vista, ma il mio è meglio 🦄😘
  </footer>

  <script>
    // --- Floating emojis generator ---
    const emojiSet = ["✨","💖","💅","🦄","🌈","⭐","💘","🦄","🎂","🎉","🥳","💞","🌟","🦄"];
    function spawnFloaty(count = 18){
      for(let i=0;i<count;i++){
        const el = document.createElement("div");
        el.className = "floaty";
        el.textContent = emojiSet[Math.floor(Math.random()*emojiSet.length)];
        el.style.setProperty("--x", (Math.random()*100) + "vw");
        el.style.setProperty("--s", (16 + Math.random()*28) + "px");
        el.style.setProperty("--t", (6 + Math.random()*7) + "s");
        el.style.animationDelay = (Math.random()*2) + "s";
        document.body.appendChild(el);
        setTimeout(()=> el.remove(), 14000);
      }
    }

    // --- Confetti (simple) ---
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    let W,H, confetti=[];
    function resize(){
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    function burstConfetti(n=160){
      for(let i=0;i<n;i++){
        confetti.push({
          x: Math.random()*W,
          y: -20 - Math.random()*H*0.2,
          r: 2 + Math.random()*5,
          vy: 2 + Math.random()*6,
          vx: -2 + Math.random()*4,
          a: Math.random()*Math.PI*2,
          va: -0.2 + Math.random()*0.4,
          life: 220 + Math.random()*140
        });
      }
    }

    function tick(){
      ctx.clearRect(0,0,W,H);
      confetti = confetti.filter(p => p.life-- > 0 && p.y < H + 40);
      for(const p of confetti){
        p.x += p.vx;
        p.y += p.vy;
        p.a += p.va;
        const hue = ( (p.x/W)*360 + (Date.now()/30) ) % 360;
        ctx.fillStyle = `hsla(${hue},100%,70%,0.9)`;
        ctx.save();
        ctx.translate(p.x,p.y);
        ctx.rotate(p.a);
        ctx.fillRect(-p.r, -p.r, p.r*2.2, p.r*2.2);
        ctx.restore();
      }
      requestAnimationFrame(tick);
    }
    tick();

    // --- Singing: Web Speech API (if available) ---
    const singBtn = document.getElementById("singBtn");
    const moreBtn = document.getElementById("moreBtn");

    function sing(){
      spawnFloaty(28);
      burstConfetti(220);

      // (opzionale) micro "bop" sulla GIF al canto
      const gif = document.getElementById("gifToon");
      gif.style.transition = "transform .12s ease-in-out";
      let t=0;
      const anim = setInterval(()=>{
        t++;
        const s = 1 + (t%2)*0.06;
        gif.style.transform = `scale(${s}) translateY(-2px) rotate(${t%2 ? 1 : -1}deg)`;
        if(t>22){
          clearInterval(anim);
          gif.style.transform = "";
        }
      },120);

      const text = "Tanti auguri a te, tanti auguri a te, tanti auguri regina dei gay, tanti auguri a te!";
      if("speechSynthesis" in window){
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "it-IT";
        u.rate = 0.92;
        u.pitch = 1.25;
        window.speechSynthesis.speak(u);
      } else {
        alert("Il tuo browser non supporta la voce. Ma il cringe sì.");
      }
    }

    singBtn.addEventListener("click", sing);
    moreBtn.addEventListener("click", ()=>{
      spawnFloaty(22);
      burstConfetti(120);
      document.body.style.filter = "saturate(1.35) contrast(1.05)";
      setTimeout(()=> document.body.style.filter = "", 900);
    });

    // Autostart mini-cringe
    spawnFloaty(10);
  </script>
</body>
</html>
